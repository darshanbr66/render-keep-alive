name: Render Keep Alive

on:
  schedule:
    - cron: "3/10 * * * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render services
        env:
          RENDER_URLS: ${{ secrets.RENDER_URLS }}
        run: |
          status=0

          while IFS= read -r url; do
            [ -z "$url" ] && continue

            echo "Pinging: $url"

            if curl --fail --silent --show-error --max-time 30 "$url"; then
              echo "Success: $url"
            else
              echo "Failed: $url"
              status=1
            fi
          done <<< "$RENDER_URLS"

          exit $status
