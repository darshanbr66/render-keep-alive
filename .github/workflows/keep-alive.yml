name: Render Keep Alive

on:
  schedule:
    - cron: "3/10 * * * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render services
        run: |
          status=0

          urls=(
            "${{ secrets.RENDER_URL_1 }}"
            "${{ secrets.RENDER_URL_2 }}"
          )

          for url in "${urls[@]}"; do
            [ -z "$url" ] && continue

            echo "Pinging: $url"

            if curl --fail --silent --show-error --max-time 30 "$url"; then
              echo "Success: $url"
            else
              echo "Failed: $url"
              status=1
            fi
          done

          exit $status
